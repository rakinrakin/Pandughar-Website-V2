server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types text/plain text/css text/xml application/xml text/javascript application/javascript application/json image/svg+xml;

  # v3 is the home page; the earlier versions stay at their own file names
  location = / {
    try_files /v3.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
